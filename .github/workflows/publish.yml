name: publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC for npm provenance + jsr tokenless publish

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun check
      - run: bun test
      - run: bun run build

  npm:
    needs: verify
    runs-on: ubuntu-latest
    # Gated by the 'npm' environment — requires approval in repo settings
    # before the publish step runs.
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install
      - run: bun run build
      - run: npm stage publish

  jsr:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # jsr publishes source, not dist — but needs deps installed for type resolution
      - run: bun install
      - run: bunx jsr@latest publish
